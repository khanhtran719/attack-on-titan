name: Titan Hunter 3D — CI & Security Regression

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Typecheck, Build & Authoritative Regression Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate 3D GLB assets
        run: npm run generate-assets

      - name: TypeScript typecheck & production build
        run: npm run build

      - name: Run unit, integration & security regression tests
        run: npm test
