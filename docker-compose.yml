services:
  # Authoritative Colyseus + Rapier 3D Multiplayer Co-op Server (ws://localhost:2567)
  titan-hunter-server:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: server
    image: khanhtrn2608/aot-server:prod
    container_name: titan-hunter-3d-server
    ports:
      - '2567:2567'
    environment:
      - PORT=2567
      - NODE_ENV=production
    restart: unless-stopped

  # Production WebGL Client (Nginx serving optimized bundle at http://localhost:8080)
  titan-hunter:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   target: prod
    image: khanhtrn2608/aot-client:prod
    container_name: titan-hunter-3d-prod
    ports:
      - '8080:80'
    depends_on:
      - titan-hunter-server
    restart: unless-stopped

