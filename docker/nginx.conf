server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver so nginx starts even if server container starts later
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $server_upstream "${SERVER_UPSTREAM}";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/wasm
        model/gltf-binary
        image/svg+xml;

    # 1. Static Bundled Assets (JS, CSS, WASM, GLB)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 2. Reverse Proxy Custom Room API (/api/rooms, /api/resolve/:code) to Colyseus Server
    location /api/ {
        proxy_pass http://$server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Reverse Proxy Colyseus Matchmaking HTTP endpoints (/matchmake/*)
    location /matchmake/ {
        proxy_pass http://$server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Reverse Proxy Colyseus Room WebSocket connections (/<processId>/<roomId>?sessionId=...)
    location ~ ^/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$ {
        proxy_pass http://$server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 5. SPA Fallback for Main Game UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 6. Container Healthcheck
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
